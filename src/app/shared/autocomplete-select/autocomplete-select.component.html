<div class="relative">
  <ul
    *ngIf="isSelect"
    @opacityLeave
    class="absolute z-10 mt-1 max-h-60 w-full overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm"
    role="listbox"
    tabindex="-1"
  >
    <li
      (click)="select(item)"
      (mouseover)="setHighlight(item)"
      *ngFor="let item of list$ | async"
      [ngClass]="{
        'text-white': highlight?.id === item.id,
        'bg-indigo-600': highlight?.id === item.id,
        'text-gray-900': highlight?.id !== item.id
      }"
      class="text-gray-900 relative cursor-default select-none py-2 pl-3 pr-9"
      id="listbox-option-0"
      role="option"
    >
      <span
        [ngClass]="{
          'font-semibold': current?.id === item.id,
          'font-normal': current?.id !== item.id
        }"
        class="font-normal block truncate"
      >
        {{ item.name }}
      </span>

      <span
        *ngIf="item.id === current?.id"
        [ngClass]="{
          'text-white': highlight?.id === item.id,
          'text-indigo-600': highlight?.id !== item.id
        }"
        class="text-indigo-600 absolute inset-y-0 right-0 flex items-center pr-4"
      >
        <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            clip-rule="evenodd"
            d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
            fill-rule="evenodd"
          />
        </svg>
      </span>
    </li>
  </ul>
</div>

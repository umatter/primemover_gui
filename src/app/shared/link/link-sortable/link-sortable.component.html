<span
  (click)="onClick()"
  class="group inline-flex cursor-pointer select-none items-center gap-1 transition hover:text-ink"
>
  {{ label }}
  <span *ngIf="sortIcon" class="invisible flex-none text-faint group-hover:visible group-focus:visible">
    <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
</span>

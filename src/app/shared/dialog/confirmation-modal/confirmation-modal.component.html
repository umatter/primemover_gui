<div *ngIf="isModal" @opacity aria-labelledby="modal-title" aria-modal="true" class="relative z-50" role="dialog">
  <div class="fixed inset-0 bg-ink/40 backdrop-blur-sm transition-opacity"></div>

  <div (click)="toggleModal()" class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div
        *ngIf="isModal"
        @opacityTranslateY
        (click)="$event.stopPropagation()"
        class="relative w-full max-w-md transform overflow-hidden rounded-2xl border border-line bg-surface p-6 text-left shadow-lg transition-all"
      >
        <div class="flex items-start gap-4">
          <div class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full bg-danger-tint text-danger">
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 9v3.75m0 3.25h.01M10.34 3.94L2.7 16.12c-.55.95.13 2.13 1.21 2.13h15.18c1.08 0 1.76-1.18 1.21-2.13L13.66 3.94c-.54-.94-1.9-.94-2.44 0z"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <h3 class="font-display text-lg font-semibold text-ink" id="modal-title">
              {{ 'common.areYouSure' | translate }}
            </h3>
            <p class="mt-1 text-sm text-muted">{{ 'common.actionPermanentWarning' | translate }}</p>
          </div>
        </div>
        <div class="mt-6 flex flex-row-reverse gap-3">
          <button
            (click)="onConfirm()"
            class="inline-flex justify-center rounded-md bg-danger px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:opacity-90"
            type="button"
          >
            {{ 'common.confirm' | translate }}
          </button>
          <button
            (click)="onCancel()"
            class="inline-flex justify-center rounded-md border border-line bg-surface px-4 py-2 text-sm font-medium text-ink shadow-sm transition hover:bg-surface-2"
            type="button"
          >
            {{ 'common.cancel' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<h3 mat-dialog-title>{{ data.title | titlecase }}</h3>
<mat-dialog-content class="mat-typography">
  <p>{{ data.description }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button (click)="emitEvent('cancel')">{{ data.cancelButtonName | titlecase }}</button>
  <button mat-raised-button color="primary" (click)="emitEvent('accept')">
    {{ data.otherButtonName | titlecase }}
  </button>
</mat-dialog-actions>

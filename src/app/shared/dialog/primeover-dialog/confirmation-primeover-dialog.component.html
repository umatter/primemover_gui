<h2 mat-dialog-title>{{ title | titlecase | translate }}</h2>
<mat-dialog-content class="mat-typography">
  <p>{{ description | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button (click)="emitEvent('cancel')">{{ cancelButtonName | titlecase | translate }}</button>
  <button mat-raised-button color="primary" (click)="emitEvent('accept')">
    {{ otherButtonName | titlecase | translate }}
  </button>
</mat-dialog-actions>

<div
  *ngIf="isModal"
  @opacity
  aria-labelledby="modal-title"
  aria-modal="true"
  class="relative z-50"
  data-modal-backdrop="static"
  role="dialog"
  tabindex="-1"
>
  <div class="fixed inset-0 bg-ink/40 backdrop-blur-sm transition-opacity"></div>
  <div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div
        *ngIf="isModal"
        @opacityTranslateY
        class="relative w-full max-w-xl transform overflow-hidden rounded-2xl border border-line bg-surface p-6 text-left shadow-lg transition-all sm:p-8"
      >
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>

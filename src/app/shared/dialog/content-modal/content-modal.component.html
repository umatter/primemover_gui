<div
  *ngIf="isModal"
  @opacity
  aria-hidden="true"
  aria-labelledby="modal-title"
  aria-modal="true"
  class="relative z-50"
  data-modal-backdrop="static"
  role="dialog"
  tabindex="-1"
>
  <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
  <div class="fixed inset-0 z-10 overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center items-center sm:p-0">
      <div
        *ngIf="isModal"
        @opacityTranslateY
        class="relative transform overflow-hidden rounded-lg bg-white p-8 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-xl"
      >
        <ng-content></ng-content>

<!-- Global notification live region -->
<div
  *ngIf="show"
  @fadeSlideInOut
  aria-live="assertive"
  class="pointer-events-none fixed inset-0 z-50 flex items-end px-4 py-6 sm:items-start sm:p-6"
>
  <div class="flex w-full flex-col items-center space-y-4 sm:items-end">
    <div class="pointer-events-auto w-full max-w-sm overflow-hidden rounded-xl border border-line bg-surface shadow-lg">
      <div class="p-4">
        <div class="flex items-start gap-3">
          <div class="flex-shrink-0 pt-0.5">
            <span
              *ngIf="typeSuccess"
              class="flex h-7 w-7 items-center justify-center rounded-full bg-success-tint text-success"
            >
              <svg
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span *ngIf="typeInfo" class="flex h-7 w-7 items-center justify-center rounded-full bg-info-tint text-info">
              <svg
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M12 8h.01M11 12h1v4h1" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span
              *ngIf="typeError"
              class="flex h-7 w-7 items-center justify-center rounded-full bg-danger-tint text-danger"
            >
              <svg
                class="h-4 w-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M12 8v4m0 4h.01" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
          </div>
          <div class="w-0 flex-1">
            <p class="text-sm font-semibold text-ink">{{ titleText }}</p>
            <!-- A notification can now render on its kind alone, so an empty body
                 must not leave a stray blank line under the title. Server messages
                 can be long: wrap them instead of overflowing the toast. -->
            <p *ngIf="bodyText" class="mt-0.5 break-words text-sm text-muted">{{ bodyText }}</p>
          </div>
          <div class="flex flex-shrink-0">
            <button
              (click)="close()"
              class="inline-flex rounded-md p-1 text-faint transition hover:bg-surface-2 hover:text-ink focus:outline-none focus:ring-2 focus:ring-brand/30"
              type="button"
            >
              <span class="sr-only">Close</span>
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

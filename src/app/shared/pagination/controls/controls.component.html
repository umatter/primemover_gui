<pagination-controls
  class="pagination-wrapper"
  (pageChange)="onPageChange($event)"
  [id]="id"
  previousLabel="{{ 'pagination.previousLabel' | translate }}"
  nextLabel="{{ 'pagination.nextLabel' | translate }}"
  screenReaderPaginationLabel="{{ 'pagination.label' | translate }}"
  screenReaderPageLabel="{{ 'pagination.page' | translate }}"
  screenReaderCurrentLabel="{{ 'pagination.onPage' | translate }}"
>
</pagination-controls>

<app-confirmation-modal (modalResponse)="onModalResponse($event)" [isModal]="!!confirmModal"></app-confirmation-modal>

<div class="flex min-h-full flex-col">
  <!-- ============================== Top bar ============================== -->
  <header class="sticky top-0 z-30 border-b border-line bg-surface/90 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-6 px-4 sm:px-6 lg:px-8">
      <!-- Brand -->
      <a class="group flex flex-shrink-0 items-center gap-2.5" routerLink="experiments">
        <span class="relative flex h-8 w-8 items-center justify-center rounded-lg bg-brand">
          <span class="absolute h-2 w-2 rounded-full bg-accent"></span>
          <svg class="h-5 w-5 text-on-brand/90" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.4" opacity="0.55" />
            <path d="M12 3.75v8.25l5.5 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="font-display text-xl font-semibold tracking-tight text-ink">PrimeMover</span>
      </a>

      <!-- Primary nav (desktop) -->
      <app-navbar *ngIf="isLoggedIn$ | async" class="hidden lg:block"></app-navbar>

      <div class="flex flex-1 items-center justify-end gap-1">
        <!-- Language -->
        <div class="hidden items-center rounded-md bg-surface-2 p-0.5 sm:flex">
          <button
            (click)="onLanguageChange(language.value)"
            *ngFor="let language of availableLanguages"
            class="rounded px-2 py-1 text-xs font-semibold text-muted transition hover:text-ink"
            type="button"
          >
            {{ language.name }}
          </button>
        </div>

        <!-- Account (desktop) -->
        <div class="relative ml-1 hidden flex-shrink-0 lg:block">
          <button
            (click)="toggleUserMenu()"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-tint text-sm font-semibold text-brand transition hover:bg-line"
            type="button"
            aria-haspopup="true"
            [attr.aria-expanded]="showUserMenu"
          >
            <span class="sr-only">{{ 'auth.settings' | translate }}</span>
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M5 19.5c1.6-3 4-4.5 7-4.5s5.4 1.5 7 4.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div
            [hidden]="!showUserMenu"
            class="absolute right-0 z-10 mt-2 w-52 origin-top-right overflow-hidden rounded-lg border border-line bg-surface py-1 shadow-lg"
            role="menu"
          >
            <a
              (click)="toggleUserMenu()"
              class="block px-4 py-2 text-sm text-ink transition hover:bg-surface-2"
              routerLink="user/settings"
              role="menuitem"
            >
              {{ 'auth.settings' | translate }}
            </a>
            <div class="my-1 h-px bg-line"></div>
            <button
              (click)="signOutRequested()"
              class="block w-full px-4 py-2 text-left text-sm text-danger transition hover:bg-danger-tint"
              role="menuitem"
              type="button"
            >
              {{ 'auth.signOut' | translate }}
            </button>
          </div>
        </div>

        <!-- Mobile menu button -->
        <button
          (click)="onMenuOpen(true)"
          class="inline-flex items-center justify-center rounded-md p-2 text-muted transition hover:bg-surface-2 hover:text-ink lg:hidden"
          type="button"
        >
          <span class="sr-only">Open menu</span>
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================== Mobile menu ============================== -->
  <div *ngIf="menuOpen" class="relative z-40 lg:hidden">
    <div (click)="onMenuOpen(false)" class="fixed inset-0 bg-ink/30 backdrop-blur-sm"></div>
    <div class="fixed inset-y-0 right-0 w-full max-w-xs animate-fade-in bg-surface p-5 shadow-lg">
      <div class="mb-6 flex items-center justify-between">
        <span class="font-display text-lg font-semibold text-ink">PrimeMover</span>
        <button
          (click)="onMenuOpen(false)"
          class="rounded-md p-2 text-muted transition hover:bg-surface-2 hover:text-ink"
          type="button"
        >
          <span class="sr-only">Close menu</span>
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <nav class="flex flex-col gap-1">
        <a
          (click)="onMenuOpen(false)"
          class="rounded-md px-3 py-2.5 text-base font-medium text-ink transition hover:bg-surface-2"
          routerLink="experiments"
          routerLinkActive="bg-brand-tint text-brand"
        >
          {{ 'experiment.label' | translate }}
        </a>
        <a
          (click)="onMenuOpen(false)"
          class="rounded-md px-3 py-2.5 text-base font-medium text-ink transition hover:bg-surface-2"
          routerLink="library"
          routerLinkActive="bg-brand-tint text-brand"
        >
          {{ 'nav.library' | translate }}
        </a>
        <a
          (click)="onMenuOpen(false)"
          class="rounded-md px-3 py-2.5 text-base font-medium text-ink transition hover:bg-surface-2"
          routerLink="user/settings"
        >
          {{ 'auth.settings' | translate }}
        </a>
      </nav>
      <div class="my-4 h-px bg-line"></div>
      <button
        (click)="onMenuOpen(false); signOutRequested()"
        class="w-full rounded-md px-3 py-2.5 text-left text-base font-medium text-danger transition hover:bg-danger-tint"
        type="button"
      >
        {{ 'auth.signOut' | translate }}
      </button>
    </div>
  </div>

  <!-- ============================== Content ============================== -->
  <app-main-wrapper class="flex-1"></app-main-wrapper>

  <!-- ============================== Footer ============================== -->
  <footer class="border-t border-line">
    <div
      class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-faint sm:flex-row sm:px-6 lg:px-8"
    >
      <span class="font-display text-ink">PrimeMover</span>
      <span>Designed for rigorous, reproducible algorithm research.</span>
    </div>
  </footer>
</div>

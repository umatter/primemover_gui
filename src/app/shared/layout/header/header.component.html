<div class="px-4 pt-5 sm:px-6">
  <h3 class="text-lg font-medium leading-6 text-gray-900">Filter</h3>
  <p class="mt-1 max-w-2xl text-sm text-gray-500">Currently applied selections. Remove to reset.</p>
</div>
<header *ngIf="hasFilter$ | async" class="bg-white shadow-sm px-4 py-5 sm:px-6">
  <app-removable-badge
    (clickEvent)="resetQueryFilter(queryFilter.name)"
    *ngFor="let queryFilter of queryFilter$ | async"
    [pillStyle]="true"
    class="inline-block pb-2"
    label="{{ queryFilter.name }}/{{ queryFilter.value }}"
    link="#"
  >
  </app-removable-badge>
  <app-removable-badge
    (clickEvent)="resetExperimentFilter($event)"
    *ngIf="currentExperiment$ | async"
    [pillStyle]="true"
    class="inline-block pb-2"
    label="{{ 'experiment.label' | translate }} | {{ (currentExperiment$ | async)?.name }}"
    link="experiments"
  >
  </app-removable-badge>
  <app-removable-badge
    (clickEvent)="resetCrawlerFilter($event)"
    *ngIf="currentCrawler$ | async"
    [pillStyle]="true"
    class="inline-block pb-2"
    label="{{ 'crawler.label' | translate }} | {{ (currentCrawler$ | async)?.name }}"
    link="crawlers"
  >
  </app-removable-badge>
  <app-removable-badge
    (clickEvent)="resetQueueFilter($event)"
    *ngIf="currentQueue$ | async"
    [pillStyle]="true"
    class="inline-block pb-2"
    label="{{ 'queue.label' | translate }} | {{ (currentQueue$ | async)?.name }}"
    link="queues"
  >
  </app-removable-badge>
</header>

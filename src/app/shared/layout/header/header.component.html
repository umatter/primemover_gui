<section *ngIf="(queryFilter$ | async)?.length">
  <div class="px-4 pt-5 sm:px-6">
    <h3 class="text-lg font-medium leading-6 text-gray-900">{{ 'filter.title' | translate }}</h3>
    <p class="mt-1 max-w-2xl text-sm text-gray-500">{{ 'filter.bodyText' | translate }}</p>
  </div>
  <header class="bg-white shadow-sm px-4 py-5 sm:px-6">
    <app-removable-badge
      (clickEvent)="resetQueryFilter(queryFilter.name)"
      *ngFor="let queryFilter of queryFilter$ | async"
      [pillStyle]="true"
      class="inline-block pb-2"
      label="{{ queryFilter.name | titlecase }} / {{ queryFilter.value }}"
      link="#"
    >
    </app-removable-badge>
  </header>
</section>

<div class="mt-2 flex w-full items-center justify-center">
  <label
    class="flex h-56 w-full cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-line-strong bg-surface-2 transition hover:border-brand hover:bg-brand-tint/40"
    for="dropzone-file"
  >
    <div class="flex flex-col items-center justify-center px-6 py-5 text-center">
      <svg
        class="mb-3 h-9 w-9 text-faint"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <p class="mb-1 text-sm text-muted">
        <span class="font-semibold text-brand">{{ 'upload.clickToUpload' | translate }}</span>
        {{ 'upload.orDragAndDrop' | translate }}
      </p>
      <p class="text-xs text-faint">{{ 'upload.experimentUploadFormat' | translate }}</p>
    </div>
    <input accept="application/json" class="hidden" id="dropzone-file" type="file" />
  </label>
</div>

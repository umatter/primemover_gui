<ng-container *ngIf="pillStyle">
  <!-- Small option -->
  <a
    *ngIf="sizeSmall"
    class="inline-flex items-center py-0.5 pl-2 pr-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-700 mr-1.5"
  >
    {{ label }}
    <button
      type="button"
      (click)="onClick($event)"
      class="flex-shrink-0 ml-0.5 h-4 w-4 rounded-full inline-flex items-center justify-center text-indigo-400 hover:bg-indigo-200 hover:text-indigo-500 focus:outline-none focus:bg-indigo-500 focus:text-white"
    >
      <span class="sr-only">Close</span>
      <svg class="h-2 w-2" stroke="currentColor" fill="none" viewBox="0 0 8 8">
        <path stroke-linecap="round" stroke-width="1.5" d="M1 1l6 6m0-6L1 7" />
      </svg>
    </button>
  </a>
  <!-- Large option -->
  <a
    *ngIf="!sizeSmall"
    class="inline-flex rounded-full items-center py-1 pl-3 pr-1.5 text-sm font-medium bg-indigo-100 text-indigo-700 mr-1.5"
  >
    {{ label }}
    <button
      type="button"
      (click)="onClick($event)"
      class="z-50 flex-shrink-0 ml-0.5 h-4 w-4 rounded-full inline-flex items-center justify-center text-indigo-400 hover:bg-indigo-200 hover:text-indigo-500 focus:outline-none focus:bg-indigo-500 focus:text-white"
    >
      <span class="sr-only">Close</span>
      <svg class="h-2 w-2" stroke="currentColor" fill="none" viewBox="0 0 8 8">
        <path stroke-linecap="round" stroke-width="1.5" d="M1 1l6 6m0-6L1 7" />
      </svg>
    </button>
  </a>
</ng-container>

<div class="mt-1 sm:mt-0 sm:col-span-2">
    <input type="text" name="name" id="name" #search autocomplete="name" (keyup)="onSearch()" (keydown)="onSearch()"
        (focus)="showList()" (blur)="hideList()" placeholder="{{ 'common.namePlaceholder' | translate }}"
        class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md" />
        <button class="block ml-auto mr-8" (click)="reset()">Reset </button>
</div>

<div *ngIf="isVisible && filterSet.length > 0" (mouseover)="cursorOverSet()">
    <mat-option *ngFor="let item of filterSet ; index as i" (click)="setValue(item)">
        {{item.name}}
    </mat-option>
</div>

<div class="mt-1 sm:mt-0 sm:col-span-2">
    <input type="text" name="name" id="name" #search autocomplete="name" (focus)="showList()" (blur)="hideList()"
        placeholder="{{ 'common.namePlaceholder' | translate }}"
        class="block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md" />
    <button class="flex ml-auto mt-2" (click)="reset()">
        <mat-icon> restore </mat-icon> Reset
    </button>
</div>

<div *ngIf=" filterSet.length > 0" (mouseover)="cursorOverSet()" class="h-24 z-50 bg-white overflow-auto absolute top-9 inset-0">
    <mat-option *ngFor="let item of filterSet ; index as i" (click)="setValue(item)">
        {{item.name}}
    </mat-option>
</div>

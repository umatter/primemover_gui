<a
  class="mb-6 inline-flex items-center gap-1.5 text-sm font-medium text-muted transition hover:text-brand"
  routerLink="/agents"
>
  <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
    <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  {{ 'library.agents.title' | translate }}
</a>

<div class="max-w-3xl rounded-xl border border-line bg-surface p-6 shadow-sm">
  <p
    *ngIf="error"
    class="mb-4 rounded-md bg-danger-tint px-3 py-2 text-sm text-danger"
    data-testid="agent-create-error"
    role="alert"
  >
    {{ 'library.agents.createError' | translate }}
  </p>
  <app-agent-form (saveClicked)="onSave($event)"></app-agent-form>
</div>

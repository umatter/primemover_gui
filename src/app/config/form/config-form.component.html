<div>
  <header class="mb-6">
    <h2 class="font-display text-xl font-semibold text-ink">{{ 'library.configs.title' | translate }}</h2>
    <p class="mt-1 text-sm text-muted">{{ 'config.createIntroText' | translate }}</p>
  </header>

  <form [formGroup]="entityForm" class="space-y-5">
    <!-- Name -->
    <div>
      <label class="mb-1.5 block text-sm font-medium text-ink" for="name">{{ 'common.name' | translate }}</label>
      <div class="flex items-center gap-2">
        <div class="relative w-full">
          <input
            [formControl]="name"
            id="name"
            name="name"
            type="text"
            placeholder="{{ 'common.namePlaceholder' | translate }}"
            class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
          />
          <app-autocomplete-select
            (isSelectChange)="setFormValuesToSelectedAgent($event)"
            *ngIf="filteredConfigurations$"
            [isSelect]="showAutocompletion"
            [list$]="filteredConfigurations$"
          ></app-autocomplete-select>
        </div>
        <button
          (click)="reset()"
          [title]="'common.clear' | translate"
          type="button"
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-md border border-line text-faint transition hover:bg-surface-2 hover:text-ink"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M6 7h12M9 7V5h6v2m-7 0v12a1 1 0 001 1h6a1 1 0 001-1V7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <p *ngIf="hasError('name', 'required')" @fadeIn class="mt-1.5 text-xs text-danger">
        {{ 'common.nameRequiredError' | translate }}
      </p>
    </div>

    <!-- Description -->
    <div>
      <label class="mb-1.5 block text-sm font-medium text-ink" for="description">{{
        'common.description' | translate
      }}</label>
      <textarea
        formControlName="description"
        id="description"
        name="description"
        rows="3"
        placeholder="{{ 'common.descriptionPlaceholder' | translate }}"
        class="w-full resize-none rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
      ></textarea>
      <p *ngIf="hasError('description', 'maxlength')" @fadeIn class="mt-1.5 text-xs text-danger">
        {{ 'common.maxLengthExceed' | translate }}
      </p>
    </div>
  </form>

  <div class="mt-6 flex items-center justify-end gap-2 border-t border-line pt-5">
    <button
      (click)="onCancel()"
      type="button"
      class="rounded-md px-4 py-2 text-sm font-medium text-muted transition hover:text-ink"
    >
      {{ 'common.cancel' | translate }}
    </button>
    <button
      (click)="onSave()"
      [disabled]="!entityForm.valid"
      type="button"
      class="inline-flex items-center rounded-md bg-brand px-4 py-2 text-sm font-semibold text-on-brand shadow-sm transition hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ 'common.save' | translate }}
    </button>
  </div>
</div>

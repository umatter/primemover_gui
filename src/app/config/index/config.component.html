<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>

<app-confirmation-modal (modalResponse)="onModalResponse($event)" [isModal]="!!entityToDelete"></app-confirmation-modal>

<div *ngIf="false === (isLoading$ | async)" class="px-4">
  <div class="flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden">
          <table *ngIf="entities$ | async" class="min-w-full divide-y divide-gray-300">
            <thead>
              <tr>
                <th class="py-3.5 pl-6 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0" scope="col">
                  <app-link-sortable href="/configurations" label="{{ 'common.id' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/configurations" label="{{ 'common.name' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  {{ 'common.contact' | translate }}
                </th>
                <th class="relative py-3.5 pl-3 pr-6 sm:pr-0" scope="col">
                  <span class="sr-only"></span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr *ngFor="let item of entities$ | async">
                <td class="whitespace-nowrap py-4 pl-6 pr-3 text-sm font-medium text-gray-900 sm:pl-0">
                  {{ item.id }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.name }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.contact }}
                </td>
                <td class="relative whitespace-nowrap text-right text-sm font-medium sm:pr-0">
                  <button (click)="deleteRequested(item)" class="text-gray-400 hover:text-indigo-900">
                    <app-heroicon-trash></app-heroicon-trash>
                  </button>
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <th class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" colspan="30">
                  <app-pagination-controls (pageChange)="getData($event)" id="configurations"></app-pagination-controls>
                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

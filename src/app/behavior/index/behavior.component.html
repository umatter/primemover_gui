<app-loading-spinner *ngIf="isLoading$ | async; else content"></app-loading-spinner>
<app-content-modal [isModal]="behaviorModal">
  <app-behavior-form
    (cancelClicked)="onBehaviorModalCancel()"
    (saveClicked)="onBehaviorModalSave($event)"
    *ngIf="behaviorModal"
  ></app-behavior-form>
</app-content-modal>

<ng-template #content>
  <div class="px-4">
    <div class="sm:flex mb-6">
      <button
        (click)="behaviorModal = true"
        class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
        type="button"
      >
        {{ 'behavior.add' | translate }}
      </button>
    </div>

    <div class="flex flex-col">
      <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
          <div class="overflow-hidden">
            <table *ngIf="(entities$ | async) && paginationConfig" class="min-w-full divide-y divide-gray-300">
              <thead>
                <tr>
                  <th class="py-3.5 pl-6 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0" scope="col">
                    <app-link-sortable href="/behaviors" label="{{ 'common.id' | translate }}"></app-link-sortable>
                  </th>
                  <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                    <app-link-sortable href="/behaviors" label="{{ 'behavior.name' | translate }}"></app-link-sortable>
                  </th>
                  <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                    <app-link-sortable href="/behaviors" label="{{ 'behavior.value' | translate }}"></app-link-sortable>
                  </th>
                  <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                    <app-link-sortable href="/behaviors" label="{{ 'job.label' | translate }}"></app-link-sortable>
                  </th>
                  <th class="relative py-3.5 pl-3 pr-6 sm:pr-0" scope="col">
                    <span class="sr-only"></span>
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 bg-white">
                <tr *ngFor="let item of entities$ | async | paginate : paginationConfig">
                  <td class="whitespace-nowrap py-4 pl-6 pr-3 text-sm font-medium text-gray-900 sm:pl-0">
                    {{ item.id }}
                  </td>
                  <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                    {{ item.name }}
                  </td>
                  <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                    {{ item.value }}
                  </td>

                  <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                    {{ item.job_id }}
                  </td>

                  <td class="relative whitespace-nowrap text-right text-sm font-medium pr-1">
                    <button (click)="deleteRequested(item)" class="text-gray-400 hover:text-indigo-900">
                      <app-heroicon-trash></app-heroicon-trash>
                    </button>
                  </td>
                </tr>
              </tbody>
              <tfoot>
                <tr>
                  <th class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" colspan="30">
                    <app-pagination-controls (pageChange)="getData($event)" id="behaviors"></app-pagination-controls>
                  </th>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>

<div class="px-4 sm:px-6 lg:px-8" *ngIf="false === (isLoading$ | async)">
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-semibold text-gray-900">{{ 'proxy.label' | translate }}</h1>
      <p class="mt-2 text-sm text-gray-700">
        {{ 'proxy.list' | translate }}
      </p>
    </div>
    <div class="mt-4 sm:mt-0 sm:ml-16 sm:flex-none">
      <button type="button" (click)="router.navigate(['proxies/create'])"
        class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto">
        {{ 'proxy.add' | translate }}
      </button>
    </div>
  </div>

  <div class="mt-8 flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="flex min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="w-full overflow-hidden shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
          <table class="min-w-full divide-y divide-gray-300" *ngIf="proxiesData$ | async">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  <app-link-sortable href="/proxies" label="{{ 'common.id' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  <app-link-sortable href="/proxies" label="{{ 'common.name' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  {{ 'common.description' | translate }}
                </th>
                <!-- <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  {{ 'common.contact' | translate }}
                </th> -->
                <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
                  <span class="sr-only"></span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr class="even:bg-gray-50 odd:bg-white"
                *ngFor="let item of proxiesData$ | async | paginate: paginationConfig">
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.id }}
                </td>
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.name }}
                </td>
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.description }}
                </td>
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.contact }}
                </td>
                <!-- <td class="relative whitespace-nowrap pr-4 text-right text-sm font-medium sm:pr-6">
                  <app-button type="white" size="sm" text="{{ 'common.delete' | translate }}"
                    (click)="deleteProxy(item.id)" class="text-indigo-600 hover:text-indigo-900 mr-2">
                  </app-button>
                  <app-button type="secondary" size="sm" text="{{ 'common.select' | translate }}"
                    (click)="selectProxy(item)" class="text-indigo-600 hover:text-indigo-900">
                  </app-button>
                </td> -->
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <th colspan="30" class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  <app-pagination-controls id="proxies" (pageChange)="getData($event)"></app-pagination-controls>
                </th>
              </tr>
            </tfoot>
          </table>
        </div>
        <app-metadata></app-metadata>
      </div>
    </div>
  </div>
</div>

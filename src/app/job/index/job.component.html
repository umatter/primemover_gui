<app-notification
  *ngIf="downloadSuccess$ | async; let successMessage"
  [bodyText]="successMessage?.message"
  [typeSuccess]="true"
  titleText="Success"
></app-notification>
<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>
<app-confirmation-modal (modalResponse)="onModalResponse($event)" [isModal]="!!entityToDelete"></app-confirmation-modal>

<div *ngIf="false === (isLoading$ | async)">
  <!-- Page header -->
  <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="font-display text-3xl font-semibold tracking-tight text-ink">{{ 'job.label' | translate }}</h1>
      <p class="mt-1.5 max-w-prose text-sm text-muted">{{ 'job.formLead' | translate }}</p>
    </div>
    <button
      [routerLink]="['create']"
      class="inline-flex flex-shrink-0 items-center gap-2 rounded-md bg-brand px-4 py-2.5 text-sm font-semibold text-on-brand shadow-sm transition hover:bg-brand-hover"
      type="button"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      {{ 'job.add' | translate }}
    </button>
  </div>

  <!-- "Which of these should I look at?" — filter[bad]=1 answers it server-side, over the
       alias table the GUI deliberately does not own. -->
  <app-status-filter
    (selectedChange)="onStatusFilter($event)"
    [selected]="statusFilter"
    class="mb-4 block"
  ></app-status-filter>

  <div class="overflow-hidden rounded-xl border border-line bg-surface shadow-sm">
    <div class="overflow-x-auto">
      <table *ngIf="entities$ | async" class="min-w-full divide-y divide-line">
        <thead class="bg-surface-2">
          <tr class="text-left text-xs font-semibold uppercase tracking-wide text-faint">
            <th class="px-4 py-3" scope="col">
              <app-link-sortable
                (sortRequested)="getData()"
                [sortBy]="SortBy.ID"
                label="{{ 'common.id' | translate }}"
              ></app-link-sortable>
            </th>
            <th class="px-4 py-3" scope="col">
              <app-link-sortable
                (sortRequested)="getData()"
                [sortBy]="SortBy.NAME"
                label="{{ 'common.name' | translate }}"
              ></app-link-sortable>
            </th>
            <th class="px-4 py-3" scope="col">
              <app-link-sortable
                (sortRequested)="getData()"
                [sortBy]="SortBy.TYPE"
                label="{{ 'status.type' | translate }}"
              ></app-link-sortable>
            </th>
            <th class="px-4 py-3" scope="col">
              <!-- Severity, not the raw string: 'failed' and 'failure' are the same state
                   spelled two ways and must not sort into two blocks. -->
              <app-link-sortable
                (sortRequested)="getData()"
                [sortBy]="SortBy.SEVERITY"
                label="{{ 'status.label' | translate }}"
              ></app-link-sortable>
            </th>
            <th class="px-4 py-3" scope="col">{{ 'decision.column' | translate }}</th>
            <th class="px-4 py-3" scope="col">
              <app-link-sortable
                (sortRequested)="getData()"
                [sortBy]="SortBy.QUEUE"
                label="{{ 'workspace.sections.runs' | translate }}"
              ></app-link-sortable>
            </th>
            <th class="px-4 py-3 text-right" scope="col"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-line">
          <tr *ngFor="let item of entities$ | async | paginate: paginationConfig" class="transition hover:bg-surface-2">
            <td class="whitespace-nowrap px-4 py-3.5 font-mono text-xs text-faint">{{ item.id }}</td>
            <td class="whitespace-nowrap px-4 py-3.5 text-sm font-medium text-ink">{{ item.name }}</td>
            <td class="whitespace-nowrap px-4 py-3.5 text-sm text-muted">{{ item.type }}</td>
            <td class="px-4 py-3.5 text-sm text-muted">
              <app-status
                [showMessage]="true"
                [statusCode]="item.status_code"
                [statusMessage]="item.status_message"
                class="block max-w-sm"
              ></app-status>
              <!-- Timestamps and the captcha flag, which the API sends on every job row and
                   this table has never shown. Collapsed by default: it is reference, not
                   headline. -->
              <app-job-diagnostics [job]="item" class="block max-w-sm"></app-job-diagnostics>
            </td>
            <!-- Did the treatment actually apply? Nothing else in this row can answer that:
                 a lost treatment finishes green, with a valid selector and a real click. -->
            <td class="px-4 py-3.5 text-sm text-muted">
              <app-decision-badge [job]="item"></app-decision-badge>
              <app-decision-report
                *ngIf="showsDecision(item)"
                [job]="item"
                class="block max-w-sm"
              ></app-decision-report>
            </td>
            <td class="whitespace-nowrap px-4 py-3.5 font-mono text-xs text-faint">Q-{{ item.queue_id }}</td>
            <td class="whitespace-nowrap px-4 py-3.5 text-right">
              <div class="flex items-center justify-end gap-0.5">
                <button
                  (click)="downloadReport(item)"
                  *ngIf="item.reports_with_path_count"
                  [title]="'experiment.download' | translate"
                  class="rounded-md p-2 text-faint transition hover:bg-surface-3 hover:text-brand"
                >
                  <app-heroicon-download-archive></app-heroicon-download-archive>
                </button>
                <button
                  (click)="selectJob(item)"
                  [title]="'common.show' | translate"
                  class="rounded-md p-2 transition hover:bg-surface-3"
                  [ngClass]="(currentJob$ | async)?.id === item.id ? 'text-brand' : 'text-faint hover:text-brand'"
                >
                  <app-heroicon-clipboard-document></app-heroicon-clipboard-document>
                </button>
                <button
                  (click)="deleteRequested(item)"
                  [title]="'common.delete' | translate"
                  class="rounded-md p-2 text-faint transition hover:bg-danger-tint hover:text-danger"
                >
                  <app-heroicon-trash></app-heroicon-trash>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-8 flex justify-center">
    <app-pagination-controls (pageChange)="getData($event)" id="jobs"></app-pagination-controls>
  </div>
</div>

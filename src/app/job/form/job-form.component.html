<div class="mx-auto max-w-2xl">
  <a
    routerLink="/jobs"
    class="mb-6 inline-flex items-center gap-1.5 text-sm font-medium text-muted transition hover:text-brand"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    {{ 'job.label' | translate }}
  </a>

  <header class="mb-8">
    <h1 class="font-display text-3xl font-semibold tracking-tight text-ink">{{ 'job.formTitle' | translate }}</h1>
    <p class="mt-1.5 max-w-prose text-sm text-muted">{{ 'job.formLead' | translate }}</p>
  </header>

  <form [formGroup]="entityForm" class="rounded-2xl border border-line bg-surface p-6 shadow-sm sm:p-8">
    <div class="space-y-5">
      <!-- Name -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-ink" for="job">{{ 'common.name' | translate }}</label>
        <div class="flex items-center gap-2">
          <div class="relative w-full">
            <input
              [formControl]="jobAutocompletion"
              id="job"
              name="job"
              type="text"
              placeholder="{{ 'common.namePlaceholder' | translate }}"
              class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
            />
            <app-autocomplete-select
              (isSelectChange)="setFormValuesToSelectedEntity($event)"
              *ngIf="filteredJobs$"
              [isSelect]="showJobAutocompletion"
              [list$]="filteredJobs$"
            ></app-autocomplete-select>
          </div>
          <button
            (click)="reset()"
            [title]="'common.clear' | translate"
            type="button"
            class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-md border border-line text-faint transition hover:bg-surface-2 hover:text-ink"
          >
            <app-heroicon-trash></app-heroicon-trash>
          </button>
        </div>
        <p *ngIf="hasError('name', 'required')" @fadeIn class="mt-1.5 text-xs text-danger">
          {{ 'common.nameRequiredError' | translate }}
        </p>
      </div>

      <!-- Run (queue) -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-ink" for="queue">{{
          'workspace.sections.runs' | translate
        }}</label>
        <div class="flex items-center gap-2">
          <div class="relative w-full">
            <input
              [formControl]="queueAutocompletion"
              id="queue"
              name="queue"
              type="text"
              placeholder="{{ 'common.select' | translate }}"
              class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20 disabled:bg-surface-2 disabled:text-muted"
            />
            <app-autocomplete-select
              (isSelectChange)="setFormValuesToSelectedQueue($event)"
              *ngIf="filteredQueues$"
              [isSelect]="showQueueAutocompletion"
              [list$]="filteredQueues$"
            ></app-autocomplete-select>
          </div>
          <button
            (click)="resetQueueAutocompletion()"
            [title]="'common.clear' | translate"
            type="button"
            class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-md border border-line text-faint transition hover:bg-surface-2 hover:text-ink"
          >
            <app-heroicon-trash></app-heroicon-trash>
          </button>
        </div>
      </div>

      <!-- Type + previous job -->
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="type">{{ 'job.type.label' | translate }}</label>
          <select
            formControlName="type"
            id="type"
            name="type"
            autocomplete="off"
            class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition focus:border-brand focus:ring-2 focus:ring-brand/20"
          >
            <option disabled selected value="null">{{ 'job.selectType' | translate }}</option>
            <option *ngFor="let jobType of jobTypes" [value]="jobType">{{ 'job.type.' + jobType | translate }}</option>
          </select>
          <p *ngIf="hasError('type', 'required')" @fadeIn class="mt-1.5 text-xs text-danger">
            {{ 'common.typeRequiredError' | translate }}
          </p>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="previous-job">{{
            'job.previousJob' | translate
          }}</label>
          <select
            [formControl]="previousJob"
            id="previous-job"
            name="previous-job"
            class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition focus:border-brand focus:ring-2 focus:ring-brand/20"
          >
            <option disabled selected value="null">{{ 'job.selectPreviousJob' | translate }}</option>
            <option *ngFor="let job of filteredJobs$ | async" [value]="job.id">{{ job.id }} — {{ job.name }}</option>
          </select>
          <p *ngIf="hasError('previous_job_id', 'required')" @fadeIn class="mt-1.5 text-xs text-danger">
            {{ 'common.previousJobRequiredError' | translate }}
          </p>
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-ink" for="description">{{
          'common.description' | translate
        }}</label>
        <textarea
          formControlName="description"
          id="description"
          name="description"
          rows="2"
          placeholder="{{ 'common.descriptionPlaceholder' | translate }}"
          class="w-full resize-none rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
        ></textarea>
        <p *ngIf="hasError('description', 'required')" @fadeIn class="mt-1.5 text-xs text-danger">
          {{ 'common.descriptionRequiredError' | translate }}
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 flex items-center justify-between border-t border-line pt-6">
      <button routerLink="/jobs" type="button" class="text-sm font-medium text-muted transition hover:text-ink">
        {{ 'common.cancel' | translate }}
      </button>
      <button
        (click)="onSave()"
        [disabled]="!entityForm.valid"
        type="button"
        class="inline-flex items-center gap-2 rounded-md bg-brand px-5 py-2.5 text-sm font-semibold text-on-brand shadow-sm transition hover:bg-brand-hover disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ 'common.save' | translate }}
      </button>
    </div>
  </form>
</div>

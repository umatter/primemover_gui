<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>
<div *ngIf="(isLoading$ | async) === false" class="px-4">
  <div class="sm:flex mb-6">
    <button
      (click)="router.navigate(['queues/create'])"
      class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
      type="button"
    >
      {{ 'queue.add' | translate }}
    </button>
  </div>

  <div class="flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden">
          <table *ngIf="data$ | async" class="min-w-full divide-y divide-gray-300">
            <thead>
              <tr>
                <th class="py-3.5 pl-6 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'common.id' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'queue.label' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'status.processed' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'status.processing' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'status.review' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'status.label' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/queues" label="{{ 'queue.cralwer_id' | translate }}"></app-link-sortable>
                </th>
                <th class="relative py-3.5 pl-3 pr-6 sm:pr-0" scope="col">
                  <span class="sr-only"></span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr *ngFor="let item of data$ | async | paginate : paginationConfig">
                <td class="whitespace-nowrap py-4 pl-6 pr-3 text-sm font-medium text-gray-900 sm:pl-0">
                  {{ item.id }}
                </td>
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.name }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.processed ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.processing ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.review ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  <app-status [statusCode]="item.status_code" [statusMessage]="item.status_message"></app-status>
                </td>

                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.crawler_id }}
                </td>

                <td class="relative whitespace-nowrap text-right text-sm font-medium sm:pr-0">
                  <app-button
                    (click)="deleteQueue(item)"
                    class="text-indigo-600 hover:text-indigo-900 mr-2"
                    size="sm"
                    text="{{ 'common.delete' | translate }}"
                    type="white"
                  >
                  </app-button>
                  <app-button
                    (click)="selectQueue(item)"
                    class="text-indigo-600 hover:text-indigo-900"
                    size="sm"
                    text="{{ 'common.select' | translate }}"
                    type="primary"
                  >
                  </app-button>
                </td>
              </tr>

              <!-- More people... -->
            </tbody>
            <tfoot>
              <tr>
                <th class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" colspan="30">
                  <app-pagination-controls (pageChange)="getData($event)" id="queues"></app-pagination-controls>
                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

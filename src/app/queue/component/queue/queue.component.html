<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>
<div class="px-4 sm:px-6 lg:px-8" *ngIf="(isLoading$ | async) === false">
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-semibold text-gray-900">{{ 'queue.label' | translate }}</h1>
      <p class="mt-2 text-sm text-gray-700">
        {{ 'queue.list' | translate }}
      </p>
    </div>
    <div class="mt-4 sm:mt-0 sm:ml-16 sm:flex-none">
      <button type="button" 
      (click)="router.navigate(['queues/create'])"
        class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto">
        {{ 'queue.add' | translate }}
      </button>
    </div>
  </div>

  <div class="mt-8 flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="md:rounded-lg flex min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="grow bordre-r-1 overflow-hidden shadow ring-1 ring-black ring-opacity-5 ">
          <table class="min-w-full divide-y divide-gray-300" *ngIf="data$ | async">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  <app-link-sortable href="/queues" label="{{ 'common.id' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                  <app-link-sortable href="/queues" label="{{ 'queue.label' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                  <app-link-sortable href="/queues" label="{{ 'status.processed' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 text-center">
                  <app-link-sortable href="/queues" label="{{ 'status.processing' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 text-center">
                  <app-link-sortable href="/queues" label="{{ 'status.review' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                  <app-link-sortable href="/queues" label="{{ 'status.label' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                  <app-link-sortable href="/queues" label="{{ 'queue.cralwer_id' | translate }}"></app-link-sortable>
                </th>
                <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
                  <span class="sr-only"></span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr class="even:bg-gray-50 odd:bg-white" *ngFor="let item of data$ | async | paginate: paginationConfig">
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.id }}
                </td>
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.name }}fefre
                </td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  {{ item.processed ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500 text-center">
                  {{ item.processing ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500 text-center">
                  {{ item.review ? 'Ja' : 'Nein' }}
                </td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  <app-status [statusMessage]="item.status_message" [statusCode]="item.status_code"> </app-status>
                </td>

                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                  {{ item.crawler_id }}
                </td>



                <td class="relative whitespace-nowrap pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
                  <app-button type="primary" size="sm" text="{{ 'common.select' | translate }}"
                    (click)="selectQueue(item)" class="text-indigo-600 hover:text-indigo-900">
                  </app-button>
                </td>
              </tr>

              <!-- More people... -->
            </tbody>
            <tfoot>
              <tr>
                <th colspan="30" class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  <app-pagination-controls id="queues" (pageChange)="getData($event)"></app-pagination-controls>
                </th>
              </tr>
            </tfoot>
          </table>
        </div>
        <app-metadata></app-metadata>
      </div>
    </div>
  </div>
</div>

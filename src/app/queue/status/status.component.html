<div class="flex min-w-0 items-center gap-2">
  <!-- role="img" + aria-label so the state AND its diagnostic are announced as one label. -->
  <span
    [ngSwitch]="code"
    [attr.aria-label]="(labelKey | translate) + (message ? ' — ' + message : '')"
    [attr.title]="message || null"
    class="inline-flex flex-shrink-0"
    role="img"
  >
    <span
      *ngSwitchCase="QueueStatusEnum.FAILURE"
      class="inline-flex items-center gap-1.5 rounded-full bg-danger-tint px-2.5 py-1 text-xs font-semibold text-danger"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-danger"></span>{{ 'status.failure' | translate }}
    </span>
    <span
      *ngSwitchCase="QueueStatusEnum.WARNING"
      class="inline-flex items-center gap-1.5 rounded-full bg-warning-tint px-2.5 py-1 text-xs font-semibold text-warning"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-warning"></span>{{ 'status.warning' | translate }}
    </span>
    <span
      *ngSwitchCase="QueueStatusEnum.SUCCESS"
      class="inline-flex items-center gap-1.5 rounded-full bg-success-tint px-2.5 py-1 text-xs font-semibold text-success"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-success"></span>{{ 'status.success' | translate }}
    </span>
    <span
      *ngSwitchCase="QueueStatusEnum.SKIPPED"
      class="inline-flex items-center gap-1.5 rounded-full bg-surface-2 px-2.5 py-1 text-xs font-semibold text-muted"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-faint"></span>{{ 'status.skipped' | translate }}
    </span>
    <span
      *ngSwitchCase="QueueStatusEnum.RUNNING"
      class="inline-flex items-center gap-1.5 rounded-full bg-info-tint px-2.5 py-1 text-xs font-semibold text-info"
    >
      <span class="h-1.5 w-1.5 animate-pulse-soft rounded-full bg-info"></span>{{ 'status.running' | translate }}
    </span>
    <span
      *ngSwitchDefault
      class="inline-flex items-center gap-1.5 rounded-full bg-surface-3 px-2.5 py-1 text-xs font-semibold text-muted"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-faint"></span>{{ 'status.unknown' | translate }}
    </span>
  </span>

  <!-- aria-hidden: already carried by the pill's aria-label, so it is not announced twice. -->
  <span
    *ngIf="showMessage && message"
    [attr.title]="message"
    aria-hidden="true"
    class="min-w-0 truncate text-xs text-muted"
    >{{ message }}</span
  >
</div>

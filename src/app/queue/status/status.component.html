<div [title]="statusMessage">
  <div [ngSwitch]="statusCode">
    <div *ngSwitchCase="QueueStatusEnum.FAILURE" class="text-red-600">{{ 'status.failure' | translate }}</div>
    <div *ngSwitchCase="QueueStatusEnum.SUCCESS" class="text-green-600">{{ 'status.success' | translate }}</div>
    <div *ngSwitchCase="QueueStatusEnum.SKIPPED" class="text-blue-600">{{ 'status.skipped' | translate }}</div>
    <div *ngSwitchCase="QueueStatusEnum.RUNNING" class="text-orange-700">{{ 'status.running' | translate }}</div>
    <div *ngSwitchDefault class="text-yellow-600">{{ 'status.unknown' | translate }}</div>
  </div>
</div>

<div class="px-4 sm:px-6 lg:px-8">
  <form [formGroup]="entityForm" class="space-y-8 divide-y divide-gray-200">
    <div class="space-y-8 divide-y divide-gray-200 sm:space-y-5">
      <div class="sm:flex sm:items-center">
        <div class="sm:flex-auto">
          <h1 class="text-xl font-semibold text-gray-900">{{ 'queue.label' | translate }}</h1>
          <p class="mt-2 text-sm text-gray-700">
            {{ 'queue.createIntroText' | translate }}
          </p>
        </div>
      </div>
      <div class="space-y-6 sm:space-y-5">
        <div class="space-y-6 sm:space-y-5">
          <!-- Name -->
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="queue">
              {{ 'common.name' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="relative">
                <div class="flex items-center gap-1">
                  <div class="w-full">
                    <input
                      [formControl]="queueAutocompletion"
                      autocomplete="queue"
                      class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                      id="queue"
                      name="queue"
                      placeholder="{{ 'common.namePlaceholder' | translate }}"
                      type="text"
                    />
                    <app-autocomplete-select
                      (isSelectChange)="setFormValuesToSelectedEntity($event)"
                      *ngIf="filteredQueues$"
                      [isSelect]="showAutocompletion"
                      [list$]="filteredQueues$"
                    ></app-autocomplete-select>
                  </div>
                  <button (click)="reset()" class="text-gray-400 hover:text-indigo-900">
                    <app-heroicon-trash></app-heroicon-trash>
                  </button>
                </div>
                <p *ngIf="hasError('name', 'required')" @fadeIn class="mt-2 text-sm text-red-600" id="queue-error">
                  {{ 'common.nameRequiredError' | translate }}
                </p>
              </div>
            </div>
          </div>

          <!-- Crawler -->
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="crawler">
              {{ 'crawler.label' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="relative">
                <div class="flex items-center gap-1">
                  <div class="w-full">
                    <input
                      [formControl]="crawlerAutocompletion"
                      autocomplete="crawler"
                      class="disabled:opacity-50 max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                      id="crawler"
                      name="crawler"
                      placeholder="{{ 'common.namePlaceholder' | translate }}"
                      type="text"
                    />
                    <app-autocomplete-select
                      (isSelectChange)="setFormValuesToSelectedCrawler($event)"
                      *ngIf="filteredCrawlers$"
                      [isSelect]="showCrawlerAutocompletion"
                      [list$]="filteredCrawlers$"
                    ></app-autocomplete-select>
                  </div>
                  <button (click)="resetCrawler()" class="text-gray-400 hover:text-indigo-900">
                    <app-heroicon-trash></app-heroicon-trash>
                  </button>
                </div>
                <p
                  *ngIf="crawlerAutocompletion.invalid && crawlerAutocompletion.touched"
                  @fadeIn
                  class="mt-2 text-sm text-red-600"
                  id="crawler-id-error"
                >
                  {{ 'common.crawlerRequiredError' | translate }}
                </p>
              </div>
            </div>
          </div>

          <!-- Description -->
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="description">
              {{ 'common.description' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <textarea
                class="shadow-sm block w-full focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border border-gray-300 rounded-md"
                formControlName="description"
                id="description"
                name="description"
                placeholder="{{ 'common.descriptionPlaceholder' | translate }}"
                rows="3"
              ></textarea>
              <p
                *ngIf="hasError('description', 'required')"
                @fadeIn
                class="mt-2 text-sm text-red-600"
                id="description-error"
              >
                {{ 'common.descriptionRequiredError' | translate }}
              </p>
            </div>
          </div>

          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="start_at">
              {{ 'queue.startAt' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <input
                autocomplete="start_at"
                class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                formControlName="start_at"
                id="start_at"
                name="start_at"
                placeholder="{{ 'start_at' | translate }}"
                type="datetime-local"
              />
              <p *ngIf="hasError('start_at', 'required')" @fadeIn class="mt-2 text-sm text-red-600" id="contact-error">
                {{ 'common.startDateRequiredError' | translate }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pt-5">
      <div class="flex justify-end">
        <button
          [routerLink]="['/queues']"
          class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          type="button"
        >
          {{ 'common.cancel' | translate }}
        </button>
        <button
          (click)="onSave()"
          [disabled]="!entityForm.valid"
          [ngClass]="{ 'opacity-25 hover:bg-indigo-600 ': !entityForm.valid }"
          class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          type="button"
        >
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>

<div class="mb-8">
  <p class="mb-1 text-xs font-semibold uppercase tracking-[0.14em] text-faint">{{ 'nav.library' | translate }}</p>
  <h1 class="font-display text-3xl font-semibold tracking-tight text-ink">{{ 'library.title' | translate }}</h1>
  <p class="mt-1.5 max-w-prose text-sm text-muted">{{ 'library.subtitle' | translate }}</p>
</div>

<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
  <a
    *ngFor="let entry of entries; let i = index"
    [routerLink]="entry.route"
    class="group flex animate-fade-up flex-col rounded-xl border border-line bg-surface p-6 transition hover:border-line-strong hover:shadow-md"
    [style.animation-delay]="i * 50 + 'ms'"
  >
    <span class="mb-4 flex h-11 w-11 items-center justify-center rounded-xl bg-brand-tint text-brand">
      <svg
        *ngIf="entry.icon === 'identity'"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="8" r="3.2" />
        <path d="M5 19c1.4-2.7 3.7-4.2 7-4.2s5.6 1.5 7 4.2" stroke-linecap="round" />
      </svg>
      <svg
        *ngIf="entry.icon === 'connection'"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        viewBox="0 0 24 24"
      >
        <path
          d="M9 12a3 3 0 013-3h0a3 3 0 013 3M7.5 9.5L5 12l2.5 2.5M16.5 9.5L19 12l-2.5 2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <svg
        *ngIf="entry.icon === 'behavior'"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        viewBox="0 0 24 24"
      >
        <path d="M6 7h12M6 12h12M6 17h7" stroke-linecap="round" />
      </svg>
    </span>
    <h2 class="font-display text-lg font-semibold text-ink transition group-hover:text-brand">
      {{ entry.titleKey | translate }}
    </h2>
    <p class="mt-1.5 flex-1 text-sm text-muted">{{ entry.descKey | translate }}</p>
    <span class="mt-4 inline-flex items-center gap-1 text-sm font-semibold text-brand">
      {{ 'library.manage' | translate }}
      <svg
        class="h-4 w-4 transition group-hover:translate-x-0.5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        viewBox="0 0 24 24"
      >
        <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
  </a>
</div>

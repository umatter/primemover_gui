<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-notification [bodyText]="message" [typeError]="hasErrorResponse" titleText="Failure"></app-notification>

<div class="flex min-h-screen items-center justify-center px-6 py-12">
  <div class="w-full max-w-md animate-fade-up">
    <div class="mb-8 flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand">
        <svg class="h-5 w-5 text-on-brand" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.4" opacity="0.6" />
          <path d="M12 3.75v8.25l5.5 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>
      <span class="font-display text-xl font-semibold text-ink">{{ 'brand.name' | translate }}</span>
    </div>

    <div class="rounded-2xl border border-line bg-surface p-6 shadow-sm sm:p-8">
      <h1 class="font-display text-xl font-semibold text-ink">{{ 'auth.resetPassword' | translate }}</h1>

      <form [formGroup]="form" class="mt-6 space-y-5">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="password">{{
            'auth.newPassword' | translate
          }}</label>
          <input
            formControlName="password"
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="{{ 'auth.newPassword' | translate }}"
            class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
          />
          <p @fadeIn class="mt-1.5 space-y-0.5 text-xs text-danger">
            <span *ngIf="autoCompleteHasError('required') || hasError('password', 'required')" class="block">
              {{ 'auth.passwordRequiredError' | translate }}
            </span>
            <span *ngIf="hasError('password', 'minlength')" class="block">{{
              'auth.passwordMinCharsError' | translate
            }}</span>
            <span *ngIf="hasError('password', 'pattern')" class="block">{{
              'auth.passwordPatternError' | translate
            }}</span>
          </p>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="confirmPassword">{{
            'auth.confirmPassword' | translate
          }}</label>
          <input
            formControlName="confirmPassword"
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="{{ 'auth.confirmPassword' | translate }}"
            class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
          />
          <p *ngIf="notMatchPassworError()" @fadeIn class="mt-1.5 text-xs text-danger">
            {{ 'auth.passwordConfirmError' | translate }}
          </p>
        </div>

        <button
          (click)="onSubmit()"
          [disabled]="!form.valid"
          type="submit"
          class="w-full rounded-md bg-brand px-4 py-2.5 text-sm font-semibold text-on-brand shadow-sm transition hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand/30 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ 'common.reset' | translate }}
        </button>
      </form>
    </div>
  </div>
</div>

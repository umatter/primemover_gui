<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-notification [typeError]="hasErrorResponse" titleText="Failure" [bodyText]="message"> </app-notification>
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg">
        <div class="bg-white py-12 px-4 shadow sm:rounded-lg sm:px-10">
        <form [formGroup]="form" class="space-y-8 divide-y divide-gray-200">
        <div class="space-y-8 divide-y divide-gray-200 sm:space-y-5">
            <div class="sm:flex sm:items-center">
            <div class="sm:flex-auto">
                <h1 class="text-xl font-semibold text-gray-900">{{ 'auth.resetPassword' | translate }}</h1>
            </div>
            </div>
            <div class="space-y-6 sm:space-y-5">
                
            <div class="space-y-6 sm:space-y-5">
                <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
                <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="job">
                    {{ 'auth.newPassword' | translate }}
                </label>
                <div class="mt-1 sm:mt-0 sm:col-span-2">
                    <div class="relative">
                    <div class="flex items-center gap-1">
                        <div class="w-full">
                        <input
                            class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                            id="password"
                            formControlName="password"
                            autocomplete="password"
                            placeholder="{{ 'auth.newPassword' | translate }}"
                            type="password"
                        />
                        </div>
                    </div>
                    </div>
                    <p
                        *ngIf="autoCompleteHasError('required') || hasError('password', 'required')"
                        @fadeIn
                        class="mt-2 text-xs text-red-600"
                        id="name-error"
                    >
                        - {{ 'auth.passwordRequiredError' | translate }}
                    </p>
                    <p
                        *ngIf="hasError('password', 'minlength')"
                        @fadeIn
                        class="mt-2 text-xs text-red-600"
                        id="name-error"
                    >
                        - {{ 'auth.passwordMinCharsError' | translate }}
                    </p>
                    <p
                        *ngIf="hasError('password', 'pattern')"
                        @fadeIn
                        class="mt-2 text-xs text-red-600"
                        id="name-error"
                    >
                        - {{ 'auth.passwordPatternError' | translate }}
                    </p>
                </div>
                </div>

                <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
                    <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="job">
                        {{ 'auth.confirmPassword' | translate }}
                    </label>
                    <div class="mt-1 sm:mt-0 sm:col-span-2">
                        <div class="relative">
                        <div class="flex items-center gap-1">
                            <div class="w-full">
                            <input
                                class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                                id="confirmPassword"
                                formControlName="confirmPassword"
                                autocomplete="confirmPassword"
                                placeholder="{{ 'auth.confirmPassword' | translate }}"
                                type="password"
                            />
                            </div>
                        </div>
                        </div>
                        <p
                        *ngIf="notMatchPassworError()"
                        @fadeIn
                        class="mt-2 text-xs text-red-600"
                        id="name-error"
                    >
                        {{ 'auth.passwordConfirmError' | translate }}
                    </p>
                    </div>
                </div>
            </div>
            </div>
        </div>
    
        <div class="pt-5">
            <div>
                <button
                  type="submit"
                  (click)="onSubmit()"
                  [disabled]="!form.valid"
                  [ngClass]="{ 'opacity-25 hover:bg-indigo-600 ': !form.valid }"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                  {{ 'common.reset' | translate }}
                </button>
            </div>
        </div>
        </form>
        </div>
    </div>
</div>

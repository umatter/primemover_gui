<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-notification [typeError]="hasError" titleText="Failure" [bodyText]="message"> </app-notification>
<app-notification [typeSuccess]="typeSuccess" titleText="Success" [bodyText]="message"> </app-notification>

<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <!-- <div *ngIf="!hasError" class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50 dark:bg-gray-800 dark:text-green-400" role="alert">
        <span class="font-medium">Success, </span> {{ message }}
    </div> -->
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form class="space-y-6" [formGroup]="form">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">{{ 'auth.email' | translate }}</label>
          <div class="mt-1">
            <input
              id="email"
              formControlName="email"
              autocomplete="email"
              placeholder="{{ 'auth.email' | translate }}"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            />
          </div>
        </div>

        <div>
          <button
            type="submit"
            (click)="onSubmit()"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            {{ 'common.confirm' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

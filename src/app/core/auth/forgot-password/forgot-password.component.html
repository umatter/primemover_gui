<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<app-notification [typeError]="hasError" titleText="Failure" [bodyText]="message"></app-notification>
<app-notification [typeSuccess]="typeSuccess" titleText="Success" [bodyText]="message"></app-notification>

<div class="flex min-h-screen items-center justify-center px-6 py-12">
  <div class="w-full max-w-sm animate-fade-up">
    <div class="mb-8 flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand">
        <svg class="h-5 w-5 text-on-brand" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.4" opacity="0.6" />
          <path d="M12 3.75v8.25l5.5 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>
      <span class="font-display text-xl font-semibold text-ink">{{ 'brand.name' | translate }}</span>
    </div>

    <h1 class="font-display text-2xl font-semibold tracking-tight text-ink">{{ 'auth.resetPassword' | translate }}</h1>
    <p class="mt-1.5 text-sm text-muted">{{ 'auth.email' | translate }}</p>

    <form class="mt-8 space-y-5" [formGroup]="form">
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-ink">{{ 'auth.email' | translate }}</label>
        <input
          id="email"
          formControlName="email"
          autocomplete="email"
          placeholder="{{ 'auth.email' | translate }}"
          class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition placeholder:text-faint focus:border-brand focus:ring-2 focus:ring-brand/20"
        />
      </div>

      <button
        type="submit"
        (click)="onSubmit()"
        class="w-full rounded-md bg-brand px-4 py-2.5 text-sm font-semibold text-on-brand shadow-sm transition hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand/30 focus:ring-offset-2"
      >
        {{ 'common.confirm' | translate }}
      </button>

      <div class="text-center">
        <a href="/" class="text-sm font-medium text-muted transition hover:text-ink">{{ 'auth.signIn' | translate }}</a>
      </div>
    </form>
  </div>
</div>

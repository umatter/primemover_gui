<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>
<div @fadeIn class="px-4">
  <div class="sm:flex mb-6">
    <button
      (click)="router.navigate(['crawlers/create'])"
      class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
      type="button"
    >
      {{ 'crawler.add' | translate }}
    </button>
  </div>

  <div class="flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden">
          <table class="min-w-full divide-y divide-gray-300">
            <thead>
              <tr>
                <th class="py-3.5 pl-6 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0" scope="col">
                  <app-link-sortable href="/crawlers" label="{{ 'common.name' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/crawlers" label="{{ 'experiment.label' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/crawlers" label="{{ 'queue.label' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/crawlers" label="{{ 'status.failed' | translate }}"></app-link-sortable>
                </th>
                <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                  <app-link-sortable href="/crawlers" label="{{ 'status.succeeded' | translate }}"></app-link-sortable>
                </th>
                <th class="relative py-3.5 pl-3 pr-6 sm:pr-0" scope="col">
                  <span class="sr-only"></span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr *ngFor="let item of crawlerData$ | async | paginate : paginationConfig">
                <td class="whitespace-nowrap py-4 pl-6 pr-3 text-sm font-medium text-gray-900 sm:pl-0">
                  {{ item.name }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.experiment?.name }} / {{ item.experiment?.id }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.latest_queues_count }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.latest_queues_failed }}
                </td>
                <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                  {{ item.latest_queues_succeeded }}
                </td>
                <td class="relative whitespace-nowrap text-right text-sm font-medium pr-1">
                  <app-button
                    (click)="deleteCrawler(item)"
                    class="text-indigo-600 hover:text-indigo-900 mr-2"
                    size="sm"
                    text="{{ 'common.delete' | translate }}"
                    type="secondary"
                  >
                  </app-button>
                  <app-button
                    (click)="selectCrawler(item)"
                    class="text-indigo-600 hover:text-indigo-900"
                    size="sm"
                    text="{{ 'common.select' | translate }}"
                    type="primary"
                  >
                  </app-button>
                </td>
              </tr>

              <!-- More people... -->
            </tbody>
            <tfoot>
              <tr>
                <th class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" colspan="30">
                  <app-pagination-controls (pageChange)="getData($event)" id="crawlers"></app-pagination-controls>
                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

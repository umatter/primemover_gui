<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>
<div class="px-4 sm:px-6 lg:px-8" @fadeIn>
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-semibold text-gray-900">{{ 'crawler.label' | translate }}</h1>
      <p class="mt-2 text-sm text-gray-700">
        {{ 'crawler.list' | translate }}
      </p>
    </div>
    <div class="mt-4 sm:mt-0 sm:ml-16 sm:flex-none">
      <button
        type="button"
        (click)="router.navigate(['crawlers/create'])"
        class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
      >
        {{ 'crawler.add' | translate }}
      </button>
    </div>
  </div>

  <div class="mt-8 flex flex-col w-100">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8 flex">
        
        <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 md:rounded-lg flex w-full">
          <div class="w-8/12 bordre-r-1 border">
            <table class="min-w-full divide-y divide-gray-300">
              <thead class="bg-gray-50">
                <tr>
                  <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">
                    <app-link-sortable href="/crawlers" label="{{ 'common.name' | translate }}"></app-link-sortable>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">
                    <app-link-sortable href="/crawlers" label="{{ 'experiment.label' | translate }}"></app-link-sortable>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 text-center">
                    <app-link-sortable href="/crawlers" label="{{ 'queue.label' | translate }}"></app-link-sortable>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 text-center">
                    <app-link-sortable href="/crawlers" label="{{ 'status.failed' | translate }}"></app-link-sortable>
                  </th>
                  <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 text-center">
                    <app-link-sortable href="/crawlers" label="{{ 'status.succeeded' | translate }}"></app-link-sortable>
                  </th>
                  <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
                    <span class="sr-only"></span>
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 bg-white">
                <tr class="even:bg-gray-50 odd:bg-white" *ngFor="let item of data$ | async | paginate: paginationConfig">
                  <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
                    {{ item.name }}
                  </td>
                  <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                    {{ item.experiment?.name }} / {{ item.experiment?.id }}
                  </td>
                  <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500 text-center">
                    {{ item.latest_queues_count }}
                  </td>
                  <td class="whitespace-nowrap px-3 py-4 text-sm text-red-500 text-center">
                    {{ item.latest_queues_failed }}
                  </td>
                  <td class="whitespace-nowrap px-3 py-4 text-sm text-green-600 text-center">
                    {{ item.latest_queues_succeeded }}
                  </td>
                  <td class="relative whitespace-nowrap pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
                    <app-button
                      type="primary"
                      size="sm"
                      text="{{ 'common.select' | translate }}"
                      (click)="selectCrawler(item)"
                      class="text-indigo-600 hover:text-indigo-900"
                    >
                    </app-button>
                  </td>
                </tr>

                <!-- More people... -->
              </tbody>
              <tfoot>
                <tr>
                  <th colspan="30" class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                    <app-pagination-controls id="crawlers" (pageChange)="getData($event)"></app-pagination-controls>
                  </th>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="w-4/12 bg-white px-5">
            <div *ngFor="let dataItem of data$ | async"> 
              <h2 class="text-lg font-bold py-3 border-bottom border-bottom-1 border-1">{{dataItem.name}}</h2>
              <p>{{dataItem.description}}</p>
            </div>
            
            
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>

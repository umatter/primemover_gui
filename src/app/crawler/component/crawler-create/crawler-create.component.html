<div class="px-4 sm:px-6 lg:px-8">
  <form class="space-y-8 divide-y divide-gray-200" [formGroup]="crawlerForm">
    <div class="space-y-8 divide-y divide-gray-200 sm:space-y-5">
      <div class="sm:flex sm:items-center">
        <div class="sm:flex-auto">
          <h1 class="text-xl font-semibold text-gray-900">{{ 'crawler.label' | translate }}</h1>
          <p class="mt-2 text-sm text-gray-700">
            A list of all the crawlers in your account including their name, description and contact.
          </p>
        </div>
      </div>
      <div class="space-y-6 sm:space-y-5">
        <div class="space-y-6 sm:space-y-5">
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="name" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'common.name' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <input type="text" name="name" id="name" autocomplete="name" formControlName="name"
                placeholder="{{ 'common.namePlaceholder' | translate }}"
                class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md" />
              <p @fadeIn *ngIf="hasError('name', 'required')" class="mt-2 text-sm text-red-600" id="name-error">
                {{ 'common.nameRequiredError' | translate }}
              </p>
            </div>
          </div>
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="experiment_id" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'experiment.label' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="relative">
                <div *ngIf="experimentLoader" class="spinr">
                  <mat-spinner class="spin"></mat-spinner>
                </div>
                <app-typeahead [controlField]="'experiment_id'" [dataSet]="experiments" [maxLen]="6" (typeahead)="setcontrolValue($event)" (resetEmit)="resetTypeahead($event)">
                </app-typeahead>
              </div>
            </div>
          </div>
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="agent_id" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'agent.label' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="grid grid-cols-3">
                <div class="relative col-span-2 ">
                  <div *ngIf="agentLoader" class="spinr">
                    <mat-spinner class="spin"></mat-spinner>
                  </div>
                  <app-typeahead [controlField]="'agent_id'" [dataSet]="agents" [maxLen]="6" (typeahead)="setcontrolValue($event)">
                  </app-typeahead>
                </div>
                <button mat-raised-button class="w-28 ml-3.5 h-fit w-fit" color="primary" (click)="agentPopup()">New Agent</button>
              </div>
            </div>
          </div>
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="configuration_id" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'config.label' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="grid grid-cols-3">
                <div class="relative col-span-2 ">
                  
                  <div *ngIf="configurationLoader" class="spinr absolute right-2">
                    <mat-spinner class="spin"></mat-spinner>
                  </div>
                  <app-typeahead  [controlField]="'configuration_id'" [dataSet]="configurations" [maxLen]="6" (typeahead)="setcontrolValue($event)">
                  </app-typeahead>
                </div>
                <button mat-raised-button color="primary" class="h-fit w-fit" (click)="configurationPopup()">New Configuration</button>
              </div>
              <p @fadeIn *ngIf="hasError('configuration_id', 'required')" class="mt-2 text-sm text-red-600"
                id="experiment-error">
                {{ 'common.configurationRequiredError' | translate }}
              </p>
            </div>
          </div>
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="proxy_id" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'proxy.label' | translate }}
            </label>

            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="grid grid-cols-3">
                <div class="relative col-span-2 ">
                  <div *ngIf="proxyLoader" class="spinr">
                    <mat-spinner class="spin"></mat-spinner>
                  </div>
                  <app-typeahead  [controlField]="'proxy_id'" [dataSet]="proxies" [maxLen]="6" (typeahead)="setcontrolValue($event)">
                  </app-typeahead>
                </div>
                <button mat-raised-button color="primary" class="h-fit w-fit" (click)="proxyPopup()">New Proxy</button>
              </div>
              <p @fadeIn *ngIf="hasError('proxy_id', 'required')" class="mt-2 text-sm text-red-600"
                id="experiment-error">
                {{ 'common.proxyRequiredError' | translate }}
              </p>
            </div>
          </div>
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label for="description" class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2">
              {{ 'common.description' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <textarea id="description" name="description" rows="3" formControlName="description"
                class="shadow-sm block w-full focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border border-gray-300 rounded-md"
                placeholder="{{ 'common.descriptionPlaceholder' | translate }}"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pt-5">
      <div class="flex justify-end">
        <button type="button" (click)="router.navigate(['crawlers'])"
          class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          {{ 'common.cancel' | translate }}
        </button>
        <button type="button" [disabled]="!crawlerForm.valid"
          [ngClass]="{ 'opacity-25 hover:bg-indigo-600 ': !crawlerForm.valid}" (click)="saveCrawler()"
          class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>

<app-notification
  *ngIf="uploadError$ | async; let errorMessage"
  [bodyText]="errorMessage.message"
  [typeError]="true"
  titleText="Failure"
></app-notification>
<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>

<div class="mx-auto max-w-2xl">
  <header class="mb-8">
    <h1 class="font-display text-3xl font-semibold tracking-tight text-ink">
      {{ 'upload.uploadCrawlerTitle' | translate }}
    </h1>
    <p class="mt-1.5 max-w-prose text-sm text-muted">{{ 'upload.uploadCrawlerIntroText' | translate }}</p>
  </header>

  <form [formGroup]="uploadForm" class="rounded-2xl border border-line bg-surface p-6 shadow-sm sm:p-8">
    <div class="space-y-6">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-ink" for="crawlers">{{
          'upload.selectCrawler' | translate
        }}</label>
        <select
          [formControl]="crawlerSelect"
          id="crawlers"
          class="w-full rounded-md border border-line bg-surface px-3.5 py-2.5 text-sm text-ink shadow-xs transition focus:border-brand focus:ring-2 focus:ring-brand/20"
        >
          <option disabled value="">{{ 'upload.noCrawlerSelected' | translate }}</option>
          <option *ngFor="let item of crawlers" [selected]="crawler?.id === item?.id" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
      </div>

      <div *ngIf="currentCrawler$ | async">
        <label class="mb-1.5 block text-sm font-medium text-ink" for="file-upload">{{
          'upload.fileUpload' | translate
        }}</label>
        <app-file-upload formControlName="fileUpload" id="file-upload"></app-file-upload>
      </div>

      <div class="flex items-start gap-3 rounded-xl bg-info-tint p-4">
        <svg
          class="mt-0.5 h-5 w-5 flex-shrink-0 text-info"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8h.01M11 12h1v4h1" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="flex-1 text-sm text-ink md:flex md:items-center md:justify-between md:gap-4">
          <p>{{ 'upload.fileExampleText' | translate }}</p>
          <a
            [href]="apiDocsLink"
            target="_blank"
            class="mt-2 inline-flex flex-shrink-0 items-center gap-1 font-semibold text-info md:mt-0"
          >
            {{ 'upload.fileExampleLabel' | translate }} <span aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </div>
    </div>
  </form>
</div>

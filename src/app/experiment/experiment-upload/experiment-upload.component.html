<app-notification
  [typeError]="true"
  *ngIf="errroMessage && errroMessage.length"
  titleText="Failure"
  [bodyText]="errroMessage"
>
</app-notification>
<app-loading-spinner *ngIf="showLoader || (isLoading$ | async)"></app-loading-spinner>
<select
  id="experiments"
  class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
  (change)="selectExperiment($event)"
>
  <option *ngFor="let item of experiments" [value]="item.id" [selected]="selectExperimentId === item.id">
    {{ item.name }}
  </option>
</select>
<div class="flex items-center justify-center w-full mt-5">
  <label
    for="dropzone-file"
    class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600"
  >
    <div class="flex flex-col items-center justify-center pt-5 pb-6">
      <svg
        aria-hidden="true"
        class="w-10 h-10 mb-3 text-gray-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
        ></path>
      </svg>
      <p class="mb-2 text-sm text-gray-500 dark:text-gray-400">
        <span class="font-semibold">Click to upload</span> or drag and drop
      </p>
      <p class="text-xs text-gray-500 dark:text-gray-400">Json</p>
    </div>
    <input id="dropzone-file" type="file" class="hidden" accept="application/json" (change)="upload($event)" />
  </label>
</div>

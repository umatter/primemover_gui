<div class="px-4">
  <form [formGroup]="experimentForm" class="space-y-8 divide-y divide-gray-200">
    <div class="space-y-8 divide-y divide-gray-200 sm:space-y-5">
      <div class="sm:flex sm:items-center">
        <div class="sm:flex-auto">
          <h1 class="text-xl font-semibold text-gray-900">{{ 'experiment.label' | translate }}</h1>
          <p class="mt-2 text-sm text-gray-700">Enter experiment data.</p>
        </div>
        <div *ngIf="experimentLoader" class="spinnerStyle">
          <mat-spinner class="spin"></mat-spinner>
        </div>
      </div>
      <div class="space-y-6 sm:space-y-5">
        <div class="space-y-6 sm:space-y-5">
          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="experiment">
              {{ 'common.name' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <div class="relative">
                <div class="flex items-center gap-1">
                  <input
                    [formControl]="experimentCtrl"
                    [matAutocomplete]="auto3"
                    autocomplete="experiment"
                    class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                    id="experiment"
                    name="experiment"
                    placeholder="{{ 'common.namePlaceholder' | translate }}"
                    type="text"
                  />
                  <app-button
                    (click)="reset()"
                    class="text-indigo-600 hover:text-indigo-900"
                    size="md"
                    text="{{ 'common.reset' | translate }}"
                    type="white"
                  >
                  </app-button>
                </div>
              </div>
              <mat-autocomplete #auto3="matAutocomplete">
                <mat-option
                  (onSelectionChange)="setControlValue(experiment)"
                  *ngFor="let experiment of experiments"
                  [value]="experiment.name"
                >
                  <span>{{ experiment.name }}</span>
                </mat-option>
              </mat-autocomplete>
              <p
                *ngIf="autoCompleteHasError('required') || hasError('name', 'required')"
                @fadeIn
                class="mt-2 text-sm text-red-600"
                id="name-error"
              >
                {{ 'common.experimentRequiredError' | translate }}
              </p>
            </div>
          </div>

          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="contact">
              {{ 'common.contact' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <input
                autocomplete="contact"
                class="max-w-lg block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md"
                formControlName="contact"
                id="contact"
                name="contact"
                placeholder="{{ 'common.contactPlaceholder' | translate }}"
                type="text"
              />
              <p *ngIf="hasError('contact', 'required')" @fadeIn class="mt-2 text-sm text-red-600" id="contact-error">
                {{ 'common.contactRequiredError' | translate }}
              </p>
            </div>
          </div>

          <div class="sm:grid sm:grid-cols-3 sm:gap-4 sm:items-start sm:border-t sm:border-gray-200 sm:pt-5">
            <label class="block text-sm font-medium text-gray-700 sm:mt-px sm:pt-2" for="description">
              {{ 'common.description' | translate }}
            </label>
            <div class="mt-1 sm:mt-0 sm:col-span-2">
              <textarea
                class="shadow-sm block w-full focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border border-gray-300 rounded-md"
                formControlName="description"
                id="description"
                name="description"
                placeholder="{{ 'common.descriptionPlaceholder' | translate }}"
                rows="3"
              ></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="pt-5">
      <div class="flex justify-end">
        <button
          (click)="onClose(false)"
          class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          type="button"
        >
          {{ 'common.cancel' | translate }}
        </button>
        <button
          (click)="saveExperiment()"
          [disabled]="!experimentForm.valid"
          [ngClass]="{ 'opacity-25 hover:bg-indigo-600 ': !experimentForm.valid }"
          class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          type="button"
        >
          {{ 'common.save' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>

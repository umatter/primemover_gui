<app-loading-spinner *ngIf="isLoading$ | async"></app-loading-spinner>

<app-confirmation-modal
  (modalResponse)="onModalResponse($event)"
  [isModal]="!!experimentToDelete"
></app-confirmation-modal>
<div *ngIf="false === (isLoading$ | async)" class="px-4">
  <div class="sm:flex mb-6">
    <button
      (click)="router.navigate(['experiments/create'])"
      class="inline-flex items-center justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
      type="button"
    >
      {{ 'experiment.add' | translate }}
    </button>
  </div>

  <div class="flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden">
          <table *ngIf="entities$" class="min-w-full divide-y divide-gray-300">
            <thead>
            <tr>
              <th class="py-3.5 pl-6 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0" scope="col">
                {{ 'common.id' | translate }}
              </th>
              <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                <app-link-sortable href="/experiments" label="{{ 'common.name' | translate }}"></app-link-sortable>
              </th>
              <th class="py-3.5 px-3 text-left text-sm font-semibold text-gray-900" scope="col">
                <app-link-sortable
                  href="/experiments"
                  label="{{ 'common.updatedAt' | translate }}"
                ></app-link-sortable>
              </th>
              <th class="relative py-3.5 pl-3 pr-6 sm:pr-0" scope="col">
                <span class="sr-only"></span>
              </th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let item of entities$ | async | paginate : paginationConfig">
              <td class="whitespace-nowrap py-4 pl-6 pr-3 text-sm font-medium text-gray-900 sm:pl-0">
                {{ item.id }}
              </td>

              <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                {{ item.name }}
              </td>
              <td class="whitespace-nowrap py-4 px-3 text-sm text-gray-500">
                {{ item.updated_at | date : 'dd.MM.yyyy HH:mm' }}
              </td>
              <td class="relative whitespace-nowrap text-right text-sm font-medium pr-1">
                <button (click)="downloadExperimentData(item)" class="text-gray-400 hover:text-indigo-900 mr-2">
                  <app-heroicon-download-archive></app-heroicon-download-archive>
                </button>
                <button (click)="deleteExperimentRequest(item)" class="text-gray-400 hover:text-indigo-900 mr-2">
                  <app-heroicon-trash></app-heroicon-trash>
                </button>
                <button
                  (click)="selectExperiment(item)"
                  [ngClass]="{
                      'text-gray-400': (currentExperiment$ | async)?.id !== item.id,
                      'hover:text-indigo-900': (currentExperiment$ | async)?.id !== item.id,
                      'text-indigo-900': (currentExperiment$ | async)?.id === item.id
                    }"
                >
                  <app-heroicon-clipboard-document></app-heroicon-clipboard-document>
                </button>
                <button (click)="selectAndUploadExperiment(item)" class="text-gray-400 hover:text-indigo-900 ml-2">
                  <app-heroicon-upload></app-heroicon-upload>
                </button>
              </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
              <th class="whitespace-nowrap px-3 py-4 text-sm text-gray-500" colspan="30">
                <app-pagination-controls (pageChange)="getData($event)" id="experiments"></app-pagination-controls>
              </th>
            </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

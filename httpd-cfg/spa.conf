RewriteEngine On

# If an existing asset or directory is requested go to it as it is
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
RewriteRule ^ - [L]

# If the requested resource doesn't exist, use index.html
RewriteRule ^ /index.html

# ----------------------------------------------------------------------
# Set right mime-types for the following files
# ----------------------------------------------------------------------
<IfModule mime_module>
    AddType text/css .css
    AddType image/svg+xml .svg
    AddType application/vnd.ms-fontobject .eot
    AddType application/x-font-opentype .otf
    AddType application/x-font-ttf .ttf
    AddType application/font-woff .woff
    AddType application/font-woff2 .woff2
</IfModule>

# ----------------------------------------------------------------------
# Cache Control via HTTP Headers + Expires
# Generation of Expires and Cache-Control HTTP headers according to user-specified criteria
# ----------------------------------------------------------------------

# Expires Defaults
<IfModule mod_expires.c>
	ExpiresActive On
	# Set default expires to 2 days
	ExpiresDefault A172800
	ExpiresByType text/css A31536000
	ExpiresByType application/x-javascript A31536000
	ExpiresByType text/x-component A31536000
	ExpiresByType text/html A3600
	ExpiresByType text/richtext A3600
	ExpiresByType image/svg+xml A3600
	ExpiresByType text/plain A3600
	ExpiresByType text/xsd A3600
	ExpiresByType text/xsl A3600
	ExpiresByType text/xml A3600
	ExpiresByType application/json A31536000
	ExpiresByType video/asf A31536000
	ExpiresByType video/avi A31536000
	ExpiresByType image/bmp A31536000
	ExpiresByType image/gif A31536000
	ExpiresByType application/x-gzip A31536000
	ExpiresByType image/x-icon A31536000
	ExpiresByType image/jpeg A31536000
	ExpiresByType application/pdf A31536000
	ExpiresByType image/png A31536000
	ExpiresByType image/svg+xml A31536000
	ExpiresByType image/tiff A31536000
	ExpiresByType application/x-font-otf A31536000
	ExpiresByType application/x-font-ttf A31536000
	ExpiresByType application/font-woff A31536000
	ExpiresByType application/font-woff2 A31536000
	ExpiresByType application/zip A31536000
</IfModule>

# 0 MIN
<filesMatch "\.(html|js|css|json)$">
	ExpiresDefault A0
	Header set Cache-Control "private, no-cache, max-age=0, must-revalidate"
</filesMatch>

# 1 WEEK
<filesMatch "\.(jpg|jpeg|png|gif|swf)$">
	ExpiresDefault A604800
	Header set Cache-Control "max-age=604800, must-revalidate"
</filesMatch>

# 1 MONTH
<filesMatch "\.(ico|pdf|flv)$">
	ExpiresDefault A2419200
	Header set Cache-Control "max-age=2419200, must-revalidate"
</filesMatch>

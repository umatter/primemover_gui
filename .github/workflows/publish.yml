# Publish the production GUI image to GHCR.
#
# CI (ci.yml) already lints, tests, builds the prod bundle, and runs the
# endpoint-injection smoke test against the built IMAGE. What it does not do is
# publish -- so there has never been a pullable artifact to deploy. ex63-infra's
# apps.yml carries a `# image: ghcr.io/qamelab/primemover:latest` placeholder for
# exactly this image; this workflow produces it.
#
# Pinning: ex63-infra's deploy policy is "pin image tags -- latest is a
# placeholder, not a policy" (it defeats the operator's drift check). So this
# publishes IMMUTABLE tags -- the commit sha on every main build, and the git
# tag on a release -- and deliberately does NOT publish a moving `latest`. The
# deployment references the sha (or a vX.Y.Z tag), never a tag that silently
# moves.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/<repo> with the built-in token
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tags only: `sha-<shortsha>` on every build, plus the semver on
      # a `v*` git tag. No `latest`. `type=sha` yields the short-sha form the
      # deploy pins against.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Reuses the repo's own Dockerfile unchanged -- the same one ci.yml builds
      # and smoke-tests -- so a published image is the image CI proved. The
      # endpoint stays runtime-injected via API_ENDPOINT; nothing is baked in.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pin the sha tag in ex63-infra/compose/apps.yml." >> "$GITHUB_STEP_SUMMARY"
